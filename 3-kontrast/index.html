<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Kontrast och färg</title>
</head>
<body>
    <main class="page">
        <h1>Lediga platser</h1>
        <p class="intro">Uppdaterad idag klockan 09.00.</p>

        <ul class="session-list">
            <li class="session">
                <span class="session-name">Baddaren, tisdag 17.00</span>
                <span class="status status-available"></span>
            </li>
            <li class="session">
                <span class="session-name">Baddaren, torsdag 17.00</span>
                <span class="status status-full"></span>
            </li>
            <li class="session">
                <span class="session-name">Sköldpaddan, tisdag 18.00</span>
                <span class="status status-limited"></span>
            </li>
            <li class="session">
                <span class="session-name">Vuxna, lördag 09.00</span>
                <span class="status status-available"></span>
            </li>
        </ul>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Anmälan till simskolan</title>
</head>
<body>
    <main class="page">
        <h1>Anmälan till simskolan</h1>

        <form>
            <div class="error-message"></div>

            <div class="field">
                <label for="namn">Barnets namn</label>
                <input type="text" id="namn" name="namn">
            </div>

            <div class="field">
                <label for="epost">E-post till vårdnadshavare</label>
                <input type="text" id="epost" name="epost">
                <span class="field-hint">Hit skickar vi bekräftelsen.</span>
            </div>

            <div class="field">
                <label for="telefon">Telefon</label>
                <input type="text" id="telefon" name="telefon">
            </div>

            <div class="field">
                <label for="fodelsedatum">Födelsedatum</label>
                <input type="text" id="fodelsedatum" name="fodelsedatum">
            </div>

            <fieldset class="fieldset">
                <div class="fieldset-label">Vilken grupp?</div>
                <div class="radio-row">
                    <input type="radio" id="skoldpaddan" name="grupp" value="baddaren">
                    <label for="skoldpaddan">Baddaren, nybörjare</label>
                </div>
                <div class="radio-row">
                    <input type="radio" id="skoldpaddan" name="grupp" value="skoldpaddan">
                    <label for="skoldpaddan">Sköldpaddan, fortsättning</label>
                </div>
                <div class="radio-row">
                    <input type="radio" id="vuxna" name="grupp" value="vuxna">
                    <label for="vuxna">Vuxna</label>
                </div>
            </fieldset>

            <div class="checkbox-row">
                <input type="checkbox" id="villkor" name="villkor">
                <label for="villkor">Jag har läst villkoren för avanmälan</span>
            </div>

            <button type="submit" class="button">Skicka anmälan</div>
        </form>
    </main>
</body>
</html>
